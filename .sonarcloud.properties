# SonarCloud automatic-analysis configuration.
#
# Duplication (copy-paste) detection exclusions — NOT analysis exclusions: bugs, security
# and code smells are still scanned in these files.
#
# The highlights harmonic-transposition port keeps deliberate mirrors by design: every
# OpenCL stage has a CPU twin it is validated against (16-leg self-test battery), and
# The highlights harmonic-transposition mode lives in per-stage modules under
# src/iop/highlights/. Each module holds a stage's CPU code beside its OpenCL twin
# (mirrored by contract), and selftests.h holds hand-copied CPU replicas of those stages whose
# entire purpose is to be textually equivalent. Copy-paste density is the design contract
# across that directory, not a defect.
sonar.cpd.exclusions=src/iop/highlights/**

# Rule exclusions (issue-level), NOT file exclusions — everything else is still scanned.
#
# c:S1836 ("remove the restrict qualifier") is a false positive for this module: the highlights
# reconstruction is a SIMD pixel pipeline whose per-pixel loops depend on `restrict` to let the
# compiler prove non-aliasing and vectorize (with -ftree-vectorize / __DT_CLONE_TARGETS__).
# `restrict` is a deliberate, load-bearing optimization here, not a hazard — removing the ~424
# qualifiers would silently de-vectorize the hot paths. Suppressed only under src/iop/highlights/.
sonar.issue.ignore.multicriteria=restrict1
sonar.issue.ignore.multicriteria.restrict1.ruleKey=c:S1836
sonar.issue.ignore.multicriteria.restrict1.resourceKey=src/iop/highlights/**

# Analysis exclusions — third-party code Ansel vendors but does not author.
#
# Git submodules are upstream projects pinned at a commit: their complexity, code smells
# and bugs are not Ansel's to fix, and counting them makes every project-level metric
# (notably cyclomatic complexity, which is a SUM) describe someone else's codebase.
# Excluding them here keeps the metrics about the code this repository actually controls.
#
#   src/external/rawspeed        RawSpeed          (submodule)
#   src/external/LibRaw          LibRaw            (submodule)
#   src/external/sentry-native   sentry-native     (submodule, vendors crashpad + zlib)
#   src/external/OpenCL          Khronos headers   (submodule)
#   src/external/whereami        whereami          (submodule)
#   doc/doxygen-awesome-css      Doxygen theme     (submodule)
#   tests/image_test/samples     test images       (submodule)
#
# src/external/ also holds two small vendored files that are NOT submodules but are
# equally third-party in origin (cie_colorimetric_tables.c, ThreadSafetyAnalysis.h), so
# the whole directory goes. src/external/LibRaw-cmake is upstream build glue.
sonar.exclusions=src/external/**, doc/doxygen-awesome-css/**, tests/image_test/samples/**
