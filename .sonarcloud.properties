# SonarCloud automatic-analysis configuration.
#
# Duplication (copy-paste) detection exclusions — NOT analysis exclusions: bugs, security
# and code smells are still scanned in these files.
#
# The highlights harmonic-transposition port keeps deliberate mirrors by design: every
# OpenCL stage has a CPU twin it is validated against (16-leg self-test battery), and
# The highlights harmonic-transposition mode lives in per-stage modules under
# src/iop/highlights/. Each module holds a stage's CPU code beside its OpenCL twin
# (mirrored by contract), and selftests.h holds hand-copied CPU replicas of those stages whose
# entire purpose is to be textually equivalent. Copy-paste density is the design contract
# across that directory, not a defect.
sonar.cpd.exclusions=src/iop/highlights/**

# Rule exclusions (issue-level), NOT file exclusions — everything else is still scanned.
#
# c:S1836 ("remove the restrict qualifier") is a false positive for this module: the highlights
# reconstruction is a SIMD pixel pipeline whose per-pixel loops depend on `restrict` to let the
# compiler prove non-aliasing and vectorize (with -ftree-vectorize / __DT_CLONE_TARGETS__).
# `restrict` is a deliberate, load-bearing optimization here, not a hazard — removing the ~424
# qualifiers would silently de-vectorize the hot paths. Suppressed only under src/iop/highlights/.
# cpp:S1669 ("Replace `module` with another name") fires because `module` became a keyword
# in C++20. This is a C codebase in which `module` is THE central domain noun --
# dt_iop_module_t, dt_lib_module_t, dt_view_t's module list, the whole plugin API -- and the
# C standard has no such keyword, so nothing here is at risk. Renaming it is not on the
# table: it is the vocabulary the code, the docs and the issue tracker are written in.
#
# It is suppressed because of what it costs, not merely because it is wrong: 119 of the 209
# open BLOCKER issues are this one rule -- 57% -- and they bury the findings that matter.
# The quality gate is only useful if a BLOCKER means something. Measured 2026-08-26.
sonar.issue.ignore.multicriteria=restrict1,cxx20keyword1,lockmodel1,lockmodel2,lockmodel3
sonar.issue.ignore.multicriteria.restrict1.ruleKey=c:S1836
sonar.issue.ignore.multicriteria.restrict1.resourceKey=src/iop/highlights/**
sonar.issue.ignore.multicriteria.cxx20keyword1.ruleKey=cpp:S1669
sonar.issue.ignore.multicriteria.cxx20keyword1.resourceKey=**/*

#
# c:S5486 / c:S5487 / c:S5489 are the pthread lock-state rules, and they cannot model
# src/system/dtpthread.h. The rule text says so itself -- c:S5486's own description ends
# with:
#
#     "There are recursive mutexes that can be acquired multiple times by the same thread
#      [...] Thus we assume pthread_mutex_t refers to non-recursive mutexes."
#
# Ansel's are recursive, by design and now by default: dt_pthread_mutex_init(..., NULL)
# sets PTHREAD_MUTEX_RECURSIVE, and dt_pthread_rwlock_t tracks same-thread writer depth so
# a thread re-entering its own write lock does not self-deadlock under glibc's
# PREFER_WRITER_NONRECURSIVE policy. A thread cannot race itself; deadlocking on that is a
# manufactured problem. See doc/lock-audit.md.
#
# So the analyser reports "this lock has already been acquired" at the very lines whose
# whole purpose is that acquiring it again is safe. These are the findings that pin the
# reliability rating at E, and they are not fixable -- the premise is wrong, not the code.
#
# Scoped to the one file that implements the primitives. Every other file is still checked
# by these rules, and a genuine double-lock anywhere else is still reported.
#
# This is not a substitute for lock checking: clang's -Wthread-safety does the real work
# here, and unlike symbolic execution it does not assume non-recursion -- it verifies a
# declared contract rather than counting acquisitions. The contract is REQUIRES /
# REQUIRES_SHARED on the functions, checked against ACQUIRE / RELEASE on the wrappers.
# NOT GUARDED_BY on the data: that half is unavailable to us, because clang cannot bind a
# guarded_by naming a struct member to the object being accessed in C, and ours are
# per-instance locks. See doc/lock-audit.md for the measurement, for what the contract half
# does prove -- it found two unlocked reads of dev->history -- and for the 30 findings it
# has open.
sonar.issue.ignore.multicriteria.lockmodel1.ruleKey=c:S5486
sonar.issue.ignore.multicriteria.lockmodel1.resourceKey=src/system/dtpthread.h
sonar.issue.ignore.multicriteria.lockmodel2.ruleKey=c:S5487
sonar.issue.ignore.multicriteria.lockmodel2.resourceKey=src/system/dtpthread.h
sonar.issue.ignore.multicriteria.lockmodel3.ruleKey=c:S5489
sonar.issue.ignore.multicriteria.lockmodel3.resourceKey=src/system/dtpthread.h

# Analysis exclusions — third-party code Ansel vendors but does not author.
#
# Git submodules are upstream projects pinned at a commit: their complexity, code smells
# and bugs are not Ansel's to fix, and counting them makes every project-level metric
# (notably cyclomatic complexity, which is a SUM) describe someone else's codebase.
# Excluding them here keeps the metrics about the code this repository actually controls.
#
#   src/external/rawspeed        RawSpeed          (submodule)
#   src/external/LibRaw          LibRaw            (submodule)
#   src/external/sentry-native   sentry-native     (submodule, vendors crashpad + zlib)
#   src/external/OpenCL          Khronos headers   (submodule)
#   src/external/whereami        whereami          (submodule)
#   doc/doxygen-awesome-css      Doxygen theme     (submodule)
#   tests/image_test/samples     test images       (gitignored team bank clone)
#
# src/external/ also holds two small vendored files that are NOT submodules but are
# equally third-party in origin (cie_colorimetric_tables.c, ThreadSafetyAnalysis.h), so
# the whole directory goes. src/external/LibRaw-cmake is upstream build glue.
#
# src/apps/ansel-chart/ is dead code, kept for reference only. NO build target compiles it:
# the ansel-chart tool was dropped, and the single file that was still live (common.c, the
# homography solver) now lives at src/math/homography.{c,h}, where it IS analysed. The rest
# stopped compiling some time ago for unrelated reasons (DT_GUI_BOX_SPACING undeclared,
# dt_Lab_to_prophotorgb implicitly declared), which is the clearest proof nothing builds it.
#
# It is excluded rather than fixed because its findings are neither reachable nor real: the
# two BLOCKERs on main.c date from 2020 and are false positives (target_L is realloc'd to
# N + extra + 4 doubles, and the memmove writes [extra, extra + N) -- it fits with four
# patches to spare). They only surfaced now because moving a file makes SonarCloud count its
# pre-existing findings as New Code, which is what the quality gate judges.
#
# Non-production languages. Nothing written in them is compiled into the application
# or runs on a user's machine: Python and shell helpers under tools/, YAML workflows,
# CMake and build glue, Markdown documentation. Analysing them reports the health of
# the toolbox rather than of the software, and this repository keeps a much larger
# toolbox than the frozen darktable 5.0 reference tree it is compared against, so
# counting it flatters neither side honestly. Only C, C++ and Objective-C are
# measured, matching the allowlist in tools/code_health.py.
# src/math/attic/ is archived by its own README: "Nothing here is compiled: these files
# appear in no CMake target and no file includes them." Same case as src/apps/ansel-chart/
# below -- findings there are neither reachable nor actionable, and fixing them would mean
# editing code that cannot be compiled to check the edit.
# data/themes/ansel.css is a GTK stylesheet, not a web one. GTK reuses CSS syntax over an
# entirely different element model: its type selectors are WIDGET NODE NAMES (window, notebook,
# treeview, scrolledwindow, entry, scrollbar...), and it adds constructs no browser has --
# @define-color, -gtk-icon-*, :backdrop, :selected (159 occurrences in this one file).
#
# Sonar's CSS analyser validates against the HTML element set, so every one of those correct
# GTK selectors is reported as an unknown type selector. That is 311 issues from this single
# file -- 234 of them css:S4670 -- which is 70% of the project's entire reliability count, and
# not one of them is actionable: "fixing" a selector would break the theme it styles.
#
# Excluded here rather than by rule, because sonar.issue.ignore.* is NOT honoured under
# automatic analysis (measured: the pre-existing restrict1 and lockmodel entries in this file
# have never suppressed anything). sonar.exclusions IS honoured, so it is the mechanism that
# works.
#
# Scoped to data/themes/ deliberately. The other stylesheets in this tree -- data/style/,
# data/pswp/, doc/ -- ARE web CSS, shipped in the HTML gallery export and the documentation,
# and stay analysed.
sonar.exclusions=src/external/**, doc/doxygen-awesome-css/**, tests/image_test/samples/**, \
  src/apps/ansel-chart/**, src/math/attic/**, data/themes/**, \
  **/*.py, **/*.sh, **/*.bash, **/*.pl, **/*.rb, **/*.lua, \
  **/*.yml, **/*.yaml, **/*.md, **/*.xsl, **/*.xslt, \
  **/CMakeLists.txt, **/*.cmake
