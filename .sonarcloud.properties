# SonarCloud automatic-analysis configuration.
#
# Duplication (copy-paste) detection exclusions — NOT analysis exclusions: bugs, security
# and code smells are still scanned in these files.
#
# The highlights harmonic-transposition port keeps deliberate mirrors by design: every
# OpenCL stage has a CPU twin it is validated against (16-leg self-test battery), and
# highlights_selftests.h holds hand-copied CPU replicas of production stages whose entire
# purpose is to be textually equivalent. Copy-paste density is the design contract there,
# not a defect.
sonar.cpd.exclusions=src/iop/highlights_selftests.h,src/iop/highlights_harmonic_common.h,src/iop/highlights_harmonic_cpu.h,src/iop/highlights_harmonic_cl.h
