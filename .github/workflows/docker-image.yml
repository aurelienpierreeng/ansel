name: Build and Push Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write   # the image is also attached to the monthly nightly release

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ansel source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          # Full history: get_git_version_string.sh must reach the last version tag, or
          # the version degrades to a bare hash. (An earlier edit put this only in a
          # comment and left the key at 1; the first master run showed VERSION "b4597470".)
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      # The image is built from a context without .git (.dockerignore), so the version
      # string and commit hash are computed here, where git is, and passed in.
      - name: Compute version
        run: |
          version=$(sh tools/get_git_version_string.sh)
          echo "ANSEL_VERSION=${version}" >> "$GITHUB_ENV"
          echo "ANSEL_COMMIT_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # The git string is 0.0.0+4824~gc9a3f02e8b. Every other package writes it into
          # its filename with "." for "~" (0.0.0+4824.gc9a3f02e8b), and that is what
          # tools/nightly_manifest.py parses; the archive name follows suit. A Docker
          # tag additionally forbids "+" (and "~" -- the first run died on it), so the
          # tag is the filename form with "+" as "-". The manifest undoes exactly that.
          file_version=${version//\~/.}
          echo "ANSEL_FILE_VERSION=${file_version}" >> "$GITHUB_ENV"
          echo "ANSEL_DOCKER_TAG=${file_version//+/-}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .ci/Dockerfile
          push: true
          build-args: |
            ANSEL_VERSION=${{ env.ANSEL_VERSION }}
            ANSEL_COMMIT_HASH=${{ env.ANSEL_COMMIT_HASH }}
            ANSEL_BUILD_CHANNEL=nightly
          tags: |
            aurelienpierre/ansel:current
            aurelienpierre/ansel:${{ env.ANSEL_DOCKER_TAG }}

      # The same image, as a file on the monthly release next to the other formats, so
      # the nightly manifest can link to it and a user without Docker Hub access (or
      # who wants the exact build from a given night, months later) can
      # `zstd -d < Ansel-*-docker.tar.zst | docker load`.
      #
      # A release asset must be under 2 GiB. The guard fails the step outright rather
      # than let tip upload a file GitHub would reject after the transfer.
      - name: Save the image for the release
        run: |
          command -v zstd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q zstd; }
          docker pull -q "aurelienpierre/ansel:${ANSEL_DOCKER_TAG}"
          file="Ansel-${ANSEL_FILE_VERSION}-docker.tar.zst"
          docker save "aurelienpierre/ansel:${ANSEL_DOCKER_TAG}" | zstd -T0 -19 -q -o "${file}"
          size=$(stat -c %s "${file}")
          echo "ANSEL_DOCKER_FILE=${file}" >> "$GITHUB_ENV"
          echo "Image archive: ${file}, $((size / 1048576)) MiB" >> "$GITHUB_STEP_SUMMARY"
          if (( size >= 2147483648 )); then
            echo "::error::${file} is $((size / 1048576)) MiB, over GitHub's 2 GiB asset limit -- slim the image (multi-stage Dockerfile) before it can ship on the release"
            exit 1
          fi

      - name: Compute the release tag
        run: echo "TAG=nightly-$(date -u +%Y-%m)" >> "$GITHUB_ENV"

      - name: Attach to the nightly release
        uses: aurelienpierreeng/tip@master
        with:
          tag: ${{ env.TAG }}
          rm: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.ANSEL_DOCKER_FILE }}
