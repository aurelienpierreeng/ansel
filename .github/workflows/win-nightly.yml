name: Nightly Win PKG

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  # The cron fires whether master moved or not. Before this job, every night on an unchanged
  # head rebuilt the installer and then failed to publish it, the release already holding that
  # commit's package. The release is asked first; tools/nightly_published.sh matches the commit
  # hash in the asset names. A manual dispatch builds anyway, since rebuilding on purpose is
  # what someone dispatching wants.
  published:
    if: github.repository == 'aurelienpierreeng/ansel' || github.event_name == 'workflow_dispatch'
    name: Is this commit already published
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: false
      - name: Ask the release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != "workflow_dispatch" ] && tools/nightly_published.sh \
            'ansel-@VERSION@-win64.exe'; then
            echo "already published for this commit, not rebuilt"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  Win64:
    needs: published
    if: ${{ needs.published.outputs.build == 'true' }}
    name: Nightly Ansel Win64 build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        btype:
          - RelWithDebInfo
        compiler:
          - { compiler: LLVM20, CC: clang, CXX: clang++, GCC_VER: "", LLVM_VER: "20" }
        eco: [-DBINARY_PACKAGE_BUILD=ON -DBUILD_CHANNEL=nightly -DUSE_XMLLINT=OFF]
        target:
          - skiptest
        generator:
          - Ninja
        branch:
          - { code: "${{ github.ref_name }}", label: stable }
        msystem:
          - UCRT64
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ${{ matrix.compiler.CC }}
      CXX: ${{ matrix.compiler.CXX }}
      GCC_VER: ${{ matrix.compiler.GCC_VER }}
      LLVM_VER: ${{ matrix.compiler.LLVM_VER }}
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/build
      INSTALL_PREFIX: ${{ github.workspace }}/install
      ECO: ${{ matrix.eco }}
      CMAKE_BUILD_TYPE: ${{ matrix.btype }}
      GENERATOR: ${{ matrix.generator }}
      TARGET: ${{ matrix.target }}
      BRANCH: ${{ matrix.branch.code }}
      BUILD_NAME: ${{ matrix.branch.label }}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
      - name: Checkout ansel source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 5000
          fetch-tags: true
          submodules: true
          path: src
      - name: Install Base Dependencies
        run: |
          $(cygpath ${SRC_DIR})/packaging/install-deps-windows-msys2.sh
      - name: Update lensfun data
        run: |
          python --version
          lensfun-update-data
      - name: Build and Install
        run: |
          cmake -E make_directory "${BUILD_DIR}"
          cmake -E make_directory "${INSTALL_PREFIX}"
          $(cygpath ${SRC_DIR})/.ci/ci-script.sh
      - name: Upload debug symbols to Sentry
        if: ${{ success() }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          $(cygpath ${SRC_DIR})/tools/sentry-upload-symbols.sh "$(cygpath ${BUILD_DIR})"
      - name: Check if it runs
        run: |
          $(cygpath ${INSTALL_PREFIX})/bin/ansel.exe --version || true
          $(cygpath ${INSTALL_PREFIX})/bin/ansel-cli.exe \
                 --width 2048 --height 2048 \
                 --apply-custom-presets false \
                 $(cygpath ${SRC_DIR})/data/pixmaps/256x256/ansel.png \
                 output.png \
                 --core --disable-opencl --conf host_memory_limit=8192 \
                 --conf worker_threads=4 -t 4 \
                 --conf plugins/lighttable/export/force_lcms2=FALSE \
                 --conf plugins/lighttable/export/iccintent=0
      - name: Package
        if: ${{ success() }}
        run: |
          cd "${BUILD_DIR}"
          cmake --build "${BUILD_DIR}" --target package
      - name: Package upload
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: ansel.${{ env.BUILD_NAME }}.win64
          path: ${{ env.BUILD_DIR }}/ansel-*.exe
          retention-days: 90

  upload_to_release:
    runs-on: ubuntu-latest
    needs: [published, Win64]
    env:
      REPO: "https://github.com/aurelienpierreeng/ansel"
      ROOM: "!SgRYbzspwqwwUgSQHC:matrix.org"
    steps:
      # One pre-release per month instead of one for all time: GitHub caps a release at
      # 1000 assets, and five formats a night filled the rolling v0.0.0 in under a year.
      # Releases themselves, total size and bandwidth are unlimited, so rotating the tag
      # is the whole fix. nightly-prune.yml deletes months older than the retention window.
      - name: Compute the release tag
        run: echo "TAG=nightly-$(date -u +%Y-%m)" >> "$GITHUB_ENV"
      - name: Checkout ansel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ansel.stable.win64
      # GitHub stores an asset name reduced to [A-Za-z0-9._-], so the `~' a version string
      # carries is filed as `.'. tip decides what to REPLACE by comparing its local filenames
      # with the release's assets, so a file still spelled with `~' never matches the asset it
      # should replace: tip uploads it as new and GitHub answers 422 already_exists. Renaming
      # here hands tip the name the release will use, so a dispatched rebuild of a published
      # commit replaces its package instead of failing.
      - name: Name the packages the way the release will
        run: |
          for f in ansel-*.exe; do
            [ -e "${f}" ] || continue
            case "${f}" in
              *'~'*) mv -- "${f}" "${f//\~/.}" ;;
            esac
          done
      - name: Update nightly release
        uses: aurelienpierreeng/tip@master
        with:
          tag: ${{ env.TAG }}
          rm: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ansel-*.exe

      - name: Install dependencies
        run: |
          python -m pip install simplematrixbotlib

      - name: Notify Matrix
        if: ${{ success() }}
        run: |
          FILENAME=$(tr '~' '.' <<< "$(find . -type f -iname "ansel-*.exe")")
          MESSAGE="New Exe [${FILENAME}](${{ env.REPO }}/releases/download/${{ env.TAG }}/${FILENAME}) built"
          python .ci/matrix.py \
          -m "$MESSAGE" \
          -s ${{ secrets.MATRIX_SERVER }} \
          -u ${{ secrets.MATRIX_USER }} \
          -t ${{ secrets.MATRIX_ACCESS }} \
          -r ${{ env.ROOM }}
