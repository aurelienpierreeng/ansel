#   clang-tidy pass for the code-health panel.
#
#   Kept separate from the docs workflow because clang-tidy needs a configured build
#   tree (compile_commands.json), and therefore the whole dependency set,
#   which has no business being installed just to run Doxygen. This job produces the
#   report; the docs job downloads the most recent successful one and folds it into
#   the published panel.
#
#   The check list is specified INLINE here rather than read from this repository's
#   own .clang-tidy. That is deliberate: .clang-tidy is a working tool configuration
#   scoped to unused-include detection, and the frozen darktable 5.0 reference tree
#   has a different one. The comparison is only meaningful if both codebases are
#   measured with exactly the same checks, so the ruleset lives in the workflow,
#   identical on both sides, and the local .clang-tidy is bypassed with --config.
#
