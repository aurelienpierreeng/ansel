# After every nightly, rewrite the one file that says what "latest" means, and push it
# where its consumers read it: the website (download buttons and the in-app update
# check both read ansel.photos/nightly.json), the Homebrew tap and the Scoop bucket.
#
# The per-OS workflows stay dumb -- they build and upload -- and this is the single
# place that knows about downstream. It runs once per finished nightly rather than on
# its own clock, so a build that lands late is not missed until tomorrow.
#
# Needs one secret: NIGHTLY_PUBLISH_TOKEN, a fine-grained PAT with contents:write on
# ansel-website, homebrew-ansel and scoop-ansel. See doc/nightly-distribution.md.
#
# The Docker image is read from Docker Hub's public tags API, so it needs no secret.
name: Nightly manifest

on:
  workflow_run:
    workflows:
      - "Nightly Linux PKG"
      - "Nightly Mac PKG"
      - "Nightly Win PKG"
      - "Nightly Flatpak PKG"
      - "Build and Push Docker Image"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # to title and describe a freshly created monthly release

concurrency:
  group: nightly-manifest
  cancel-in-progress: false

jobs:
  publish:
    # A failed nightly still leaves last night's assets in place; the manifest is
    # rebuilt from whatever is newest on the releases, so it is always worth running.
    if: github.repository == 'aurelienpierreeng/ansel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      # tip creates each month's release with the tag as its name and no body, and it
      # preserves whatever body exists on later uploads. So the text is applied once, by
      # the first run after the release appears, and never rewritten: the check is on
      # an empty body, not on a date, so an edit made by hand on the release survives.
      - name: Describe the monthly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="nightly-$(date -u +%Y-%m)"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body -q .body >/dev/null 2>&1; then
            echo "${tag}: no release yet"; exit 0
          fi
          if [[ -n "$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body -q .body)" ]]; then
            echo "${tag}: already described"; exit 0
          fi
          gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --title "Nightly builds, $(LC_ALL=C date -u +%B\ %Y)" \
            --notes-file packaging/nightly-release-notes.md
          echo "${tag}: described"

      - name: Build the manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/nightly_manifest.py manifest > nightly.json
          # A consumer whose formats are not all there yet (the first night of a month
          # before every OS has finished, a failed runner) is skipped, not failed: the
          # generator exits non-zero and leaves an empty file, and publish() below
          # ignores empty files. The manifest itself always publishes.
          python3 tools/nightly_manifest.py cask  nightly.json > ansel-nightly.rb   || : > ansel-nightly.rb
          python3 tools/nightly_manifest.py scoop nightly.json > ansel-nightly.json || : > ansel-nightly.json
          {
            echo "### Newest build per format"
            echo '```'
            python3 tools/nightly_manifest.py summary nightly.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy on this run
        uses: actions/upload-artifact@v6
        with:
          name: nightly-manifest
          path: |
            nightly.json
            ansel-nightly.rb
            ansel-nightly.json
          retention-days: 30

      # One shallow clone, one file, one commit, per downstream repository. The website
      # push deliberately does NOT carry [skip ci]: the data file is what the download
      # buttons render from, so its commit is exactly the one that must rebuild the
      # site. With [skip ci] the first real manifest sat unrendered until the next
      # 4-hourly scheduled build, and the page kept showing the retired v0.0.0 assets.
      - name: Publish downstream
        env:
          TOKEN: ${{ secrets.NIGHTLY_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read-only: the stats snapshot lists releases
          # Optional. The traffic API (clones per day) needs the "Administration: read"
          # repository permission, which the workflow's own GITHUB_TOKEN does not carry
          # -- the first run confirmed it, silently: a series with no traffic block. A
          # fine-grained PAT with that one permission on this repository restores it;
          # without one the snapshot is complete except for clones.
          STATS_TOKEN: ${{ secrets.NIGHTLY_STATS_TOKEN }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "::warning::NIGHTLY_PUBLISH_TOKEN is not set; manifest built but not published"
            exit 0
          fi
          # An empty manifest is never published: it would replace a good file
          # downstream with "no builds" -- which is what happened on the first run,
          # before any nightly-* release existed. The website falls back to the API on
          # an empty file, but nothing should have to.
          if ! python3 tools/nightly_manifest.py check nightly.json; then
            echo "::warning::manifest names no build; nothing published"
            echo "Nothing published: the manifest is empty." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config --global user.name  "ansel-nightly[bot]"
          git config --global user.email "nightly@ansel.photos"
          summary=$(python3 tools/nightly_manifest.py oneline nightly.json)

          publish() {  # repo  src  dest  message
            local repo=$1 src=$2 dest=$3 msg=$4 dir
            if [[ ! -s "${src}" ]]; then echo "${repo}: nothing to publish (${src} empty)"; return 0; fi
            dir=$(mktemp -d)
            git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/aurelienpierreeng/${repo}.git" "${dir}"
            mkdir -p "$(dirname "${dir}/${dest}")"
            cp "${src}" "${dir}/${dest}"
            git -C "${dir}" add "${dest}"
            if git -C "${dir}" diff --cached --quiet; then
              echo "${repo}: unchanged"
            else
              git -C "${dir}" commit -q -m "${msg}"
              git -C "${dir}" push -q origin HEAD
              echo "${repo}: updated ${dest}"
            fi
            rm -rf "${dir}"
          }

          publish ansel-website  nightly.json        data/nightly.json               "nightly: ${summary}"

          # Download statistics: one dated snapshot of every lifetime counter (GitHub
          # asset download_count, Docker Hub pull_count) appended to the series the
          # website already holds. Counters vanish with the assets the prune deletes;
          # the series is what keeps the history.
          #
          # Strictly after the manifest publish, and every command guarded: this shell
          # runs under `set -e`, so an unguarded failure here would have aborted the
          # step before the manifest was published (Sentry's review caught the
          # unguarded `append`). Whatever fails, publish() skips an empty file.
          : > download-stats.json
          if GITHUB_TOKEN="${STATS_TOKEN:-$GITHUB_TOKEN}" python3 tools/download_stats.py snapshot > today.json 2>stats.err; then
            # A partial snapshot is still a success; say what was left out rather
            # than letting a 403 on the traffic API vanish into a file nobody reads.
            [[ -s stats.err ]] && echo "::notice::download stats: $(tr '\n' ' ' < stats.err)"
            curl -fsSL --max-time 30 -o series.json \
              "https://raw.githubusercontent.com/aurelienpierreeng/ansel-website/master/data/download-stats.json" \
              || echo '[]' > series.json
            if python3 tools/download_stats.py append series.json today.json > download-stats.json 2>stats.err; then
              echo "download stats: $(python3 -c 'import json;print(len(json.load(open("download-stats.json"))))' 2>/dev/null || echo '?') day(s) on record"
            else
              echo "::warning::download stats append failed: $(cat stats.err)"; : > download-stats.json
            fi
          else
            echo "::warning::download stats snapshot failed: $(cat stats.err)"
          fi
          publish ansel-website  download-stats.json data/download-stats.json        "download stats: $(date -u +%Y-%m-%d)"
          publish homebrew-ansel ansel-nightly.rb    Casks/ansel-nightly.rb          "ansel-nightly: ${summary}"
          publish scoop-ansel    ansel-nightly.json  bucket/ansel-nightly.json       "ansel-nightly: ${summary}"
