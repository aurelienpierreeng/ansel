name: Nightly Mac PKG

on: 
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  MacOS:
    if: github.repository == 'aurelienpierreeng/ansel' || github.event_name == 'workflow_dispatch'
    name: Nightly Ansel Mac OS build
    runs-on: ${{ matrix.build.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - { 
            os: macos-15, 
            xcode: 26.3, 
            deployment: 15.0, 
            tag: "arm64",
            eco: "-DBINARY_PACKAGE_BUILD=ON -DBUILD_CHANNEL=nightly -DDT_APPLE_X86_TARGET_CLONES=0",
            } # AppleClang 17, arm64
          - { 
            os: macos-15-intel, 
            xcode: 26.3, 
            deployment: 15.0, 
            tag: "intel64",
            # TESTBUILD_OPENCL_PROGRAMS needs llvm, which install-deps-macos.sh skips here:
            # Homebrew has no Intel bottle for it any more and it is a ~4 h source build, for
            # a check the arm64 CI performs on every commit. Stated rather than left to
            # CMake's absent-LLVM fallback, which reaches the same result through warnings.
            eco: "-DBINARY_PACKAGE_BUILD=ON -DBUILD_CHANNEL=nightly -DDT_APPLE_X86_TARGET_CLONES=1 -DTESTBUILD_OPENCL_PROGRAMS=OFF",
             } # AppleClang 17, intel64
        btype:
          - RelWithDebInfo
        compiler:
          - { compiler: XCode,   CC: cc, CXX: c++ }
        target:
          - skiptest # In the case the generic .ci/ci-script.sh script is used.
                     # But in our case, we invoke the more specific .ci/ci-script-mac.sh script
        generator:
          - Ninja
        branch:
          - { code: "${{ github.ref_name }}", label: stable }
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.build.xcode }}.app/Contents/Developer
      CC: ${{ matrix.compiler.CC }}
      CXX: ${{ matrix.compiler.CXX }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.build.deployment }}
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/src/build
      INSTALL_PREFIX: ${{ github.workspace }}/src/install
      ECO: ${{ matrix.build.eco }}
      CMAKE_BUILD_TYPE: ${{ matrix.btype }}
      GENERATOR: ${{ matrix.generator }}
      TARGET: ${{ matrix.target }}
      BRANCH: ${{ matrix.branch.code }}
      BUILD_NAME: ${{ matrix.branch.label }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 5000
          submodules: true
          fetch-tags: true
          path: ${{ env.SRC_DIR }}
      # Homebrew publishes no bottles for Intel macOS any more, so a large part of the tree
      # is built from source there, and two formulae eat the job's 6-hour budget: llvm@22
      # (3h43 to over 4h54) and rust (1h05 to 1h29). Both are librsvg's -- it is written in Rust --
      # and so neither can be dropped the way our own llvm was. Their kegs are cached between
      # runs; tools/brew_cache_key.sh carries the reasoning and owns the keys. arm64 pours
      # bottles in 77 seconds and needs none of it, so the cache steps are Intel-only and the
      # quota is left to the architecture that cannot do without it.
      #
      # Each formula gets its own entry, keyed on its own version, so a bump in one does not
      # discard the other.
      - name: Resolve the Homebrew keg cache keys
        id: brewcache
        if: ${{ runner.arch == 'X64' }}
        run: |
          brew update
          "${SRC_DIR}/tools/brew_cache_key.sh" llvm@22 rust
          {
            echo "cellar=$(brew --cellar)"
            echo "opt=$(brew --prefix)/opt"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the llvm@22 keg
        id: keg-llvm_22
        if: ${{ runner.arch == 'X64' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.brewcache.outputs.cellar }}/llvm@22
            ${{ steps.brewcache.outputs.opt }}/llvm@22
          key: ${{ steps.brewcache.outputs.llvm_22_key }}
      - name: Restore the rust keg
        id: keg-rust
        if: ${{ runner.arch == 'X64' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.brewcache.outputs.cellar }}/rust
            ${{ steps.brewcache.outputs.opt }}/rust
          key: ${{ steps.brewcache.outputs.rust_key }}
      # Two different situations used to collapse into one tolerated `brew link' failure, and
      # both printed `Error:' lines that read like a broken step: a keg that was never restored
      # (a cache miss, the ordinary cold case) and a keg-only formula, which needs no link at
      # all because its opt link travelled inside the cached keg. llvm@22 is keg-only, so even a
      # cache HIT produced an error. Each case is now asked about before brew is called, so the
      # log says what happened and a genuine link failure is a genuine failure of the step.
      #
      # NEVER add --force. llvm is keg-only on purpose: forcing it would put its clang in the
      # prefix's bin ahead of Xcode's, and this build compiles with CC=cc.
      - name: Relink the restored kegs
        if: ${{ runner.arch == 'X64' }}
        run: |
          cellar="$(brew --cellar)"
          for f in llvm@22 rust; do
            if [ ! -d "${cellar}/${f}" ]; then
              echo "${f}: not in the cache -- it will be built"
              continue
            fi
            keg_only="$(brew info --json=v2 --formula "${f}" \
              | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin)["formulae"][0]["keg_only"] else "no")')"
            if [ "${keg_only}" = "yes" ]; then
              echo "${f}: restored, keg-only -- its opt link came with the keg"
              continue
            fi
            brew link --overwrite "${f}"
            echo "${f}: restored and linked"
          done
      - name: Install Base Dependencies
        run: |
          "${SRC_DIR}/packaging/install-deps-macos.sh"
      # The kegs are banked here, as soon as they exist, and not by actions/cache's own save --
      # that is a post-step at the end of the job, and a job cancelled at the 6-hour ceiling
      # never reaches it. On the nightly of 2026-09-10 the dependency step SUCCEEDED at 5h52
      # and the budget then ran out during the build, so the four hours it had just spent on
      # llvm were thrown away with the job. Saving at this point means a run that gets this far
      # warms the cache for the next one even when it dies afterwards.
      - name: Save the llvm@22 keg
        if: ${{ runner.arch == 'X64' && steps.keg-llvm_22.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.brewcache.outputs.cellar }}/llvm@22
            ${{ steps.brewcache.outputs.opt }}/llvm@22
          key: ${{ steps.brewcache.outputs.llvm_22_key }}
      - name: Save the rust keg
        if: ${{ runner.arch == 'X64' && steps.keg-rust.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.brewcache.outputs.cellar }}/rust
            ${{ steps.brewcache.outputs.opt }}/rust
          key: ${{ steps.brewcache.outputs.rust_key }}
      - name: Update lensfun data
        if: ${{ success() }}
        run: |
          lensfun-update-data
      - name: Build and Install
        run: |
          cmake -E make_directory "${BUILD_DIR}";
          cmake -E make_directory "${INSTALL_PREFIX}";
          cd ${SRC_DIR}
          .ci/ci-script-mac.sh;
      - name: Upload debug symbols to Sentry
        if: ${{ success() }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          bash "${SRC_DIR}/tools/sentry-upload-symbols.sh" "${BUILD_DIR}"
      - name: Check if it runs
        run: |
          ${INSTALL_PREFIX}/bin/ansel --version || true
          ${INSTALL_PREFIX}/bin/ansel-cli \
                 --width 2048 --height 2048 \
                 --apply-custom-presets false \
                 "${SRC_DIR}/data/pixmaps/256x256/ansel.png" \
                 output.png \
                 --core --disable-opencl --conf host_memory_limit=8192 \
                 --conf worker_threads=4 -t 4 \
                 --conf plugins/lighttable/export/force_lcms2=FALSE \
                 --conf plugins/lighttable/export/iccintent=0 || true # OpenMP builds crash for most configs
      - name: Build macOS package
        run: |
          ./src/packaging/macosx/3_make_hb_ansel_package.sh
      # Nothing before this point looks at the .app: the steps above test the install tree,
      # which had both of the binaries the bundle used to drop. This reads the bundle itself --
      # every installed executable present, every load command resolving inside it.
      - name: Check macOS bundle
        run: |
          "${SRC_DIR}/tools/check_macos_bundle.sh" "${INSTALL_PREFIX}"
      - name: Create DMG file
        run: |
          ./src/packaging/macosx/4_make_hb_ansel_dmg.sh
      - name: Package upload
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: ansel.${{ env.BUILD_NAME }}-${{ matrix.build.tag }}.mac
          path: ${{ env.INSTALL_PREFIX }}/Ansel-*.dmg
          retention-days: 90

  upload_to_release:
    runs-on: ubuntu-latest
    needs: MacOS
    # Publishing must not be all-or-nothing. This job carried `needs: MacOS' with no `if:',
    # which defaults to success() over the WHOLE matrix -- and fail-fast is off, so the two
    # architectures run independently and either one dying took the other's package with it.
    # Measured: arm64 succeeded on 2026-09-10, 09-11, 09-12, 09-13 and 09-14 and all five of
    # its DMGs were discarded, because the Intel job was killed at GitHub's 6-hour ceiling
    # each of those nights. No macOS nightly shipped at all for five days, Apple Silicon
    # included.
    #
    # always() rather than the usually-preferred !cancelled(): a job killed by the ceiling is
    # reported as cancelled, which is precisely the case this has to publish through. The cost
    # is that a run someone cancels by hand also publishes whatever was already built, which
    # for a nightly is the lesser harm.
    if: ${{ always() }}
    env:
      REPO: "https://github.com/aurelienpierreeng/ansel"
      ROOM: "!SgRYbzspwqwwUgSQHC:matrix.org"
    steps:
      # One pre-release per month instead of one for all time: GitHub caps a release at
      # 1000 assets, and five formats a night filled the rolling v0.0.0 in under a year.
      # Releases themselves, total size and bandwidth are unlimited, so rotating the tag
      # is the whole fix. nightly-prune.yml deletes months older than the retention window.
      - name: Compute the release tag
        run: echo "TAG=nightly-$(date -u +%Y-%m)" >> "$GITHUB_ENV"
      - name: Checkout ansel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      # Each architecture is fetched on its own and allowed to be missing -- that one of them
      # may have produced nothing is the whole point.
      - name: Download the Intel package
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ansel.stable-intel64.mac
      - name: Download the Apple Silicon package
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ansel.stable-arm64.mac
      # Publishing nothing is not a success. With both downloads allowed to fail, an empty
      # workspace would otherwise reach `tip' as an empty file list and the run would pass
      # having shipped nothing -- the failure this job exists to make visible.
      - name: Check that something was built
        id: dmgs
        run: |
          mapfile -t dmgs < <(find . -type f -iname 'Ansel-*.dmg' -printf '%f\n' | sort)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "Neither architecture produced a DMG; there is nothing to publish." >&2
            exit 1
          fi
          printf 'Publishing %d package(s):\n' "${#dmgs[@]}"
          printf '  %s\n' "${dmgs[@]}"
          printf 'names=%s\n' "${dmgs[*]}" >> "$GITHUB_OUTPUT"
      - name: Update nightly release
        uses: aurelienpierreeng/tip@master
        with:
          tag: ${{ env.TAG }}
          rm: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: Ansel-*.dmg

      - name: Install dependencies
        run: |
          python -m pip install simplematrixbotlib

      # The message names whatever was actually published, one package or two, instead of
      # announcing both architectures unconditionally. The names arrive through the
      # environment rather than expanded into the script body.
      - name: Notify Matrix
        if: ${{ success() }}
        env:
          NAMES: ${{ steps.dmgs.outputs.names }}
        run: |
          links=""
          count=0
          for f in ${NAMES}; do
            # A release asset spells the version's `~' as `.'.
            url_name="${f//\~/.}"
            links="${links}${links:+ and }[${url_name}](${REPO}/releases/download/${TAG}/${url_name})"
            count=$((count + 1))
          done
          if [ "${count}" -eq 1 ]; then
            MESSAGE="New dmg package ${links} built"
          else
            MESSAGE="New dmg packages ${links} built"
          fi
          python .ci/matrix.py \
          -m "$MESSAGE" \
          -s ${{ secrets.MATRIX_SERVER }} \
          -u ${{ secrets.MATRIX_USER }} \
          -t ${{ secrets.MATRIX_ACCESS }} \
          -r ${{ env.ROOM }}
