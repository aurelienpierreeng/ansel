name: Nightly Flatpak PKG

on:
  schedule:
    # An hour after the AppImage nightly, so the two do not compete for runners.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  Flatpak:
    if: github.repository == 'aurelienpierreeng/ansel' || github.event_name == 'workflow_dispatch'
    name: Nightly Ansel Flatpak build
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      # Mapped here because the `secrets` context is not available inside a step's
      # `if:` -- the whole workflow failed to parse on master the first time it ran with
      # `if: secrets.X != ''`. The `env` context is, so the optional steps test these.
      FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
      FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - name: Free disk space
        run: |
          # The GNOME SDK, the bundled dependencies and Ansel itself together
          # need more room than a stock runner leaves free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Checkout ansel source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          # get_git_version_string.sh needs the tags, and enough history to
          # reach the last one, or the package is named "unknown-version".
          fetch-depth: 5000
          fetch-tags: true
          submodules: true

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder jq

      # flatpak-builder re-downloads every dependency tarball on every run, which is
      # rude to the hosts and eventually gets refused: a run was turned away with
      # `module colord: The requested URL returned error: 418` from freedesktop.org,
      # while the same URL served a plain client 200 at the same moment. Keyed on the
      # manifest, so changing a source's url or sha256 fetches it again.
      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-downloads-${{ hashFiles('packaging/flatpak/photos.ansel.Ansel.json') }}
          restore-keys: |
            flatpak-downloads-

      # Signing is what lets a client add the repository without --no-gpg-verify.
      # Optional: with no key in the secrets the build is unsigned, exactly as before.
      - name: Import the repository signing key
        if: ${{ env.FLATPAK_GPG_KEY != '' }}
        run: |
          printf '%s\n' "$FLATPAK_GPG_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=${FLATPAK_GPG_KEY_ID}" >> "$GITHUB_ENV"

      - name: Build Flatpak
        run: packaging/flatpak/build-flatpak.sh

      # The OSTree repository is what gives users `flatpak update`; the bundle on the
      # release is a one-shot install. Published to a Cloudflare R2 bucket over the S3
      # API (free tier: 10 GB, no egress charge; a pruned repo is a few hundred MB).
      # Optional: with no R2 secrets the step is skipped and only the bundle ships.
      - name: Publish the repository to R2
        if: ${{ success() && env.R2_ACCOUNT_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: https://${{ env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPO_URL: ${{ vars.FLATPAK_REPO_URL || 'https://flatpak.ansel.photos' }}
        run: |
          # objects/ first, summary last: a client that fetches the new summary must find
          # every object it names already there.
          #
          # Cache-Control is set per object because a custom domain puts Cloudflare's CDN
          # in front of the bucket. OSTree objects are content-addressed, so they may be
          # cached forever; everything else (summary, summary.sig, refs/, config, the
          # .flatpakrepo) is what changes between nightlies and must never be served
          # stale, or `flatpak update` sees yesterday's repository for as long as the
          # edge keeps it. By default Cloudflare caches by file extension and these have
          # none, but one "Cache Everything" rule on the zone would break that silently;
          # the headers make it not matter.
          aws s3 sync build/flatpak/repo/objects "s3://${R2_BUCKET}/objects" \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync build/flatpak/repo "s3://${R2_BUCKET}/" \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors --exclude "objects/*" --delete \
            --cache-control "no-cache"
          packaging/flatpak/make-flatpakrepo.sh "${REPO_URL}" > ansel.flatpakrepo
          aws s3 cp ansel.flatpakrepo "s3://${R2_BUCKET}/ansel.flatpakrepo" \
            --endpoint-url "${R2_ENDPOINT}" --content-type "application/vnd.flatpak.repo" \
            --cache-control "no-cache" --only-show-errors
          echo "Repository published: ${REPO_URL}/ansel.flatpakrepo" >> "$GITHUB_STEP_SUMMARY"

      - name: Package upload
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: ansel.stable.flatpak
          path: build/flatpak/Ansel-*-x86_64.flatpak
          retention-days: 90

  upload_to_release:
    runs-on: ubuntu-latest
    env:
      REPO: "https://github.com/aurelienpierreeng/ansel"
      ROOM: "!SgRYbzspwqwwUgSQHC:matrix.org"
    needs: Flatpak
    steps:
      # One pre-release per month; see lin-nightly.yml for why.
      - name: Compute the release tag
        run: echo "TAG=nightly-$(date -u +%Y-%m)" >> "$GITHUB_ENV"
      - name: Checkout ansel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ansel.stable.flatpak

      - name: Update nightly release
        uses: aurelienpierreeng/tip@master
        with:
          tag: ${{ env.TAG }}
          rm: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: Ansel-*.flatpak

      - name: Install dependencies
        run: |
          python -m pip install simplematrixbotlib

      - name: Notify Matrix
        if: ${{ success() }}
        run: |
          FILENAME=$(tr '~' '.' <<< "$(find . -type f -iname "Ansel-*.flatpak")")
          MESSAGE="New Flatpak [${FILENAME}](${{ env.REPO }}/releases/download/${{ env.TAG }}/${FILENAME}) built"
          python .ci/matrix.py \
          -m "$MESSAGE" \
          -s ${{ secrets.MATRIX_SERVER }} \
          -u ${{ secrets.MATRIX_USER }} \
          -t ${{ secrets.MATRIX_ACCESS }} \
          -r ${{ env.ROOM }}
